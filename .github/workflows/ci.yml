name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt ruff pip-audit
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Python dependency audit
        run: pip-audit -r backend/requirements.txt
      - name: Frontend install, type check and build
        working-directory: frontend
        run: npm ci && npm run build && npm audit --omit=dev
      - name: End-to-end tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium && PW_CHROMIUM=none npx playwright test
