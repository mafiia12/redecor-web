# Production stack: Caddy (HTTPS, automatic certificates) -> web (FastAPI + built site) ; backup (daily, verified)
#   1. copy .env.example to .env and fill it in      2. docker compose up -d --build
# Data (database, photos, PDFs, backups) lives in the "redecor-data" volume. Back it up off the server too.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ATTACHMENTS_DIR: /attachments
    volumes:
      - redecor-data:/data
      - redecor-attachments:/attachments   # enquiry files: private, never served by Caddy
    ports:
      - "127.0.0.1:8000:8000"   # local checks only; the internet reaches the site through Caddy
    logging: *logging

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  backup:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      ATTACHMENTS_DIR: /attachments
    volumes:
      - redecor-data:/data
      - redecor-attachments:/attachments
      # - /mnt/offsite:/offsite        # optional second location, then set BACKUP_COPY_TO=/offsite in .env
    command: ["python", "/app/tools/backup.py", "--db", "/data/redecor.db", "--uploads", "/data/uploads", "--attachments", "/attachments", "--out-dir", "/data/backups", "--loop-hours", "24"]
    healthcheck: { disable: true }
    logging: *logging

  # Optional virus scanner for enquiry attachments (needs about 1-1.5 GB RAM).
  # Start with: docker compose --profile virus-scan up -d   and set VIRUS_SCAN_ENABLED=1 in .env
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    profiles: ["virus-scan"]
    volumes:
      - clamav-db:/var/lib/clamav
    logging: *logging

volumes:
  redecor-data:
  redecor-attachments:
  clamav-db:
  caddy-data:
  caddy-config:
